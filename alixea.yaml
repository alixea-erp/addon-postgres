alixeaVersion: v1.0
type: addon
name: PostgreSQL
description: PostgreSQL add-on for Alixea, with the pgvector extension.

parameterGroups:
  - name: Connection
    identifier: postgres
    description: Superuser & connection configuration
    parameters:
      - name: Host
        identifier: POSTGRES_HOST
        defaultValue: postgres.${ALIXEA_NAMESPACE}
        type: string
        readOnly: true
      - name: Port
        identifier: POSTGRES_PORT
        defaultValue: 5432
        type: integer
      - name: User
        identifier: POSTGRES_USER
        defaultValue: postgres
        type: string
        contexts: label=postgres,label=app
      - name: Password
        identifier: POSTGRES_PASSWORD
        defaultValue: postgres
        type: secret
      - name: Database
        identifier: POSTGRES_DB
        defaultValue: app
        type: string
      - name: Database_url
        identifier: DATABASE_URL
        defaultValue: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
        type: string

connectionStrings:
  - name: Connection URI
    value: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    description: This connection URI is for components within the deployment and is inaccessible externally.

logs:
  - name: PostgreSQL Log
    type: log
    labelSelector: app=postgres
    
# NOTE! No image is listed here: the platform watches a listed image and moves every deployment to a new build of its
# tag by itself. This image is not ours, so the chart names it (.alixea/helm/postgres.yaml) and it changes only with it
images: []
    
storage:
  - identifier: postgres
    sizeMiB: 6144
