apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # The official postgres image with pgvector added, by the pgvector project. NOTE! The -trixie tag: the tag
          # without it is built on another Debian, and a data folder moved between Debian versions gets collation warnings
          image: pgvector/pgvector:0.8.7-pg18-trixie
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGDATA
              value: /postgres/data
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: postgres-mount
              mountPath: /postgres
      volumes:
        - name: postgres-mount
          hostPath:
            path: {{ $.Values.storage.postgres.hostPath }}
